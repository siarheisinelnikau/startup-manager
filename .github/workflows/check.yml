name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: startup-manager
      - uses: actions/checkout@v4
        with:
          repository: siarheisinelnikau/rust-auto-updator
          ref: fc80a2648754b450f48255d64187cf7b13e18588
          path: rust-auto-updator
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
        working-directory: startup-manager
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: startup-manager
      - run: cargo test --locked
        working-directory: startup-manager
      - run: ./scripts/package.ps1
        working-directory: startup-manager
      - uses: actions/upload-artifact@v4
        with:
          name: StartupManager-Windows
          path: startup-manager/dist/*

  localization-release:
    name: Publish the explicitly requested localization release
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release localization v')
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: localization-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: StartupManager-Windows
          path: .release-input
      - name: Verify the checked executable, companion and notices
        shell: pwsh
        run: ./scripts/stage-localization-release.ps1
      - name: Publish only after every asset is verified
        uses: actions/github-script@v7
        with:
          script: |
            const publish = require('./scripts/publish-localization-release.cjs');
            await publish({github, context, core});
