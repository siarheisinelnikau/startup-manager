name: Checked release builds
'on':
  workflow_call: {}
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
jobs:
  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: startup-manager
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: siarheisinelnikau/rust-auto-updator
        ref: fc80a2648754b450f48255d64187cf7b13e18588
        path: rust-auto-updator
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        components: rustfmt, clippy
        toolchain: stable
    - run: cargo fmt --all --check
      working-directory: startup-manager
    - run: cargo clippy --all-targets --locked -- -D warnings
      working-directory: startup-manager
    - run: cargo test --locked
      working-directory: startup-manager
    - run: ./scripts/package.ps1
      working-directory: startup-manager
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: StartupManager-Windows
        path: startup-manager/dist/*
    permissions:
      contents: read
    timeout-minutes: 30
